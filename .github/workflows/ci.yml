name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-msvc:
    name: Windows / MSVC / NeoCore
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build the NeoCore solution
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $installPath) { throw "Visual Studio MSBuild was not found." }
          & "$installPath\MSBuild\Current\Bin\amd64\MSBuild.exe" NeoCore.sln /m /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run console samples and diagnostics
        shell: pwsh
        run: |
          foreach ($mode in @('--smoke', '--debug-smoke', '--compiler-error-regression', '--bench-check')) {
            & .\Build\Windows\bin\x64\Release\neocore.exe $mode
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build and test with CMake
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 -DNEOCORE_BUILD_UNITY_BRIDGE=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check the console HTTPS transport and VS Code extension
        shell: pwsh
        run: |
          python Tests/http_console_regression.py .\Build\Windows\bin\x64\Release\neocore.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check Tools/vscode-neocore/src/extension.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify managed bindings against the typed plugin
        shell: pwsh
        run: |
          $pluginDirectory = 'Unity/com.neocore.unity/Runtime/Plugins/x86_64'
          New-Item -ItemType Directory -Force -Path $pluginDirectory | Out-Null
          Copy-Item -LiteralPath 'build/Unity/NeoCore/Release/NeoCoreUnity.dll' -Destination "$pluginDirectory/NeoCoreUnity.dll"
          & ./Unity/NeoCore/check_managed.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows hosts and typed samples
        uses: actions/upload-artifact@v4
        with:
          name: neocore-windows-x64
          path: |
            Build/Windows/bin/x64/Release/
            Samples/neocore/scripts/
            Samples/neocore/minigame/scripts/
            Samples/neocore/minigame/viewer.html
            Lib/*.nc
            LICENSE
            THIRD_PARTY_NOTICES.txt
          if-no-files-found: error

  linux:
    name: Linux / ${{ matrix.compiler }} / NeoCore
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC
            cc: gcc
            cxx: g++
          - compiler: Clang
            cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v6
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes cmake ninja-build g++ clang libcurl4-openssl-dev
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B build -G Ninja -DNEOCORE_BUILD_UNITY_BRIDGE=ON -DNEOCORE_CONSOLE_HTTP=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=11 -DCMAKE_CXX_STANDARD_REQUIRED=ON -DCMAKE_CXX_EXTENSIONS=OFF "-DCMAKE_CXX_FLAGS=-Werror=c++14-extensions -Werror=c++17-extensions"
      - name: Build
        run: cmake --build build --parallel
      - name: Run compiler, runtime, C ABI and sample regressions
        run: ctest --test-dir build --output-on-failure

  android-ndk:
    name: Android / NDK / arm64-v8a
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.2.12479018"
      - name: Configure and build the typed bridge
        run: |
          ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/27.2.12479018"
          cmake -S . -B build-android -G Ninja \
            -DNEOCORE_BUILD_TESTS=OFF \
            -DNEOCORE_BUILD_EXAMPLES=OFF \
            -DNEOCORE_BUILD_UNITY_BRIDGE=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24
          cmake --build build-android --target NeoCoreUnity --parallel
      - name: Check the typed plugin exports and alignment
        run: |
          SO=build-android/Unity/NeoCore/libNeoCoreUnity.so
          READELF="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          nc=$("$READELF" --dyn-syms "$SO" | grep -c ' Nc' || true)
          cxx=$("$READELF" --dyn-syms "$SO" | grep -c ' _ZN' || true)
          echo "Nc* entry points: $nc, leaked C++ symbols: $cxx"
          test "$nc" -ge 25 || { echo "the typed C ABI is missing from the plugin"; exit 1; }
          test "$cxx" -eq 0 || { echo "the C++ runtime is being re-exported"; exit 1; }
          "$READELF" -l "$SO" | grep -q 0x4000 || { echo "not 16 KB page aligned"; exit 1; }

  ios-static:
    name: iOS / Xcode / arm64 typed plugin
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build and package the typed static plugin
        run: |
          bash Unity/build_ios.sh device
          ARCHIVE=Unity/com.neocore.unity/Runtime/Plugins/iOS/libNeoCoreUnity.a
          xcrun lipo -info "$ARCHIVE"
          xcrun nm -gU "$ARCHIVE" | grep ' _NcCompile$'
      - name: Upload the typed plugin and C header
        uses: actions/upload-artifact@v4
        with:
          name: neocore-unity-ios-arm64
          path: |
            Unity/com.neocore.unity/Runtime/Plugins/iOS/libNeoCoreUnity.a
            Unity/NeoCore/NeoCoreC.h
            LICENSE
            THIRD_PARTY_NOTICES.txt
          if-no-files-found: error
