  <text class="m" x="342" y="282">Bind(id, HostFunction)</text>
  <text class="m" x="342" y="298">BindGlobal(name, ObjectHandle)</text>
  <!-- HostCall -->
  <rect class="cls" x="670" y="220" width="320" height="96" rx="8"/>
  <rect class="head" x="671" y="221" width="318" height="26" rx="7"/>
