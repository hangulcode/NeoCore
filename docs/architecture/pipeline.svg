<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 345" width="1000" height="345" role="img" aria-label="Compilation and execution pipeline">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>
  text { font: 12px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #1a1f26; }
  .t { font: 600 13px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #1a1f26; }
  .m { font: 11px "Cascadia Mono", Consolas, Menlo, monospace; fill: #5b6774; }
  .lbl { font: 11px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #5b6774; }
  .stage { fill: #e2eff1; stroke: #0f6f7f; stroke-width: 1.2; }
  .cls { fill: #ffffff; stroke: #c9d1da; stroke-width: 1.2; }
  .head { fill: #eef3f5; stroke: none; }
  .edge { stroke: #6b7682; stroke-width: 1.4; fill: none; }
  .own { stroke: #0f6f7f; stroke-width: 1.7; fill: none; }
  .byte { fill: #ffffff; stroke: #c9d1da; stroke-width: 1.2; }
  .byte.hi { fill: #e2eff1; stroke: #0f6f7f; }
  .slot { fill: #ffffff; stroke: #c9d1da; stroke-width: 1.2; }
  .slot.own { fill: #e2eff1; stroke: #0f6f7f; }
  .brace { stroke: #5b6774; stroke-width: 1; fill: none; }
</style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7682"/></marker>
  </defs>
  <rect class="stage" x="10" y="20" width="150" height="92" rx="8"/>
  <text class="t" x="22" y="44">Source</text>
  <text x="22" y="64">.nc text, imports,</text>
  <text x="22" y="80">compile defines,</text>
  <text x="22" y="96">host schema</text>

  <rect class="stage" x="200" y="20" width="180" height="92" rx="8"/>
  <text class="t" x="212" y="44">Typed front end</text>
  <text class="m" x="212" y="62">NeoCoreCompiler.cpp</text>
  <text x="212" y="80">lex, parse, check types,</text>
  <text x="212" y="96">build TypedIR</text>

  <rect class="stage" x="420" y="20" width="180" height="92" rx="8"/>
  <text class="t" x="432" y="44">Lowering</text>
  <text class="m" x="432" y="62">NeoParser.cpp</text>
  <text x="432" y="80">IR to instructions,</text>
  <text x="432" y="96">slots and call plans</text>

  <rect class="stage" x="640" y="20" width="160" height="92" rx="8"/>
  <text class="t" x="652" y="44">Storage + export</text>
  <text class="m" x="652" y="62">NeoExport.cpp</text>
  <text x="652" y="80">slot kinds, policies,</text>
  <text x="652" y="96">image chunks</text>

  <rect class="stage" x="840" y="20" width="150" height="92" rx="8"/>
  <text class="t" x="852" y="44">Image</text>
  <text x="852" y="64">bytes plus checked</text>
  <text x="852" y="80">metadata</text>
  <text class="m" x="852" y="98">NeoCoreImage</text>

  <path class="edge" d="M160,66 L200,66" marker-end="url(#ar)"/>
  <path class="edge" d="M380,66 L420,66" marker-end="url(#ar)"/>
  <path class="edge" d="M600,66 L640,66" marker-end="url(#ar)"/>
  <path class="edge" d="M800,66 L840,66" marker-end="url(#ar)"/>

  <rect class="stage" x="840" y="180" width="150" height="120" rx="8"/>
  <text class="t" x="852" y="204">Loader</text>
  <text class="m" x="852" y="222">CNeoVMProgram</text>
  <text x="852" y="240">validate, compute</text>
  <text x="852" y="256">layouts, patch to</text>
  <text x="852" y="272">runtime opcodes</text>

  <rect class="stage" x="560" y="180" width="240" height="120" rx="8"/>
  <text class="t" x="572" y="204">Execution</text>
  <text class="m" x="572" y="222">CNeoVM, CNeoVMWorker</text>
  <text x="572" y="240">dispatch loop over VarInfo</text>
  <text x="572" y="256">payloads, contexts, coroutines,</text>
  <text x="572" y="272">builtins, pools, cycle collection</text>

  <rect class="stage" x="270" y="180" width="260" height="120" rx="8"/>
  <text class="t" x="282" y="204">Host boundary</text>
  <text class="m" x="282" y="222">NeoCore.h: Runtime, Program,</text>
  <text class="m" x="282" y="238">Instance</text>
  <text x="282" y="256">HostSchema and HostBindings,</text>
  <text x="282" y="272">ObjectHandle, Debugger,</text>
  <text x="282" y="288">C ABI and Unity package</text>

  <rect class="stage" x="10" y="180" width="220" height="120" rx="8"/>
  <text class="t" x="22" y="204">Tooling</text>
  <text class="m" x="22" y="222">Samples/neocore</text>
  <text class="m" x="22" y="238">Tools/vscode-neocore</text>
  <text x="22" y="256">console runner, DAP and LSP,</text>
  <text x="22" y="272">smoke and regression checks,</text>
  <text x="22" y="288">benchmarks</text>

  <path class="edge" d="M915,112 L915,180" marker-end="url(#ar)"/>
  <path class="edge" d="M840,240 L800,240" marker-end="url(#ar)"/>
  <path class="edge" d="M560,240 L530,240" marker-end="url(#ar)"/>
  <path class="edge" d="M270,240 L230,240" marker-end="url(#ar)"/>
  <path class="edge" d="M120,180 L120,140 L290,140 L290,112" marker-end="url(#ar)"/>
  <text class="lbl" x="132" y="156">tools drive the same front end</text>
  <text class="lbl" x="10" y="330">Arrows show the direction of data. The host boundary wraps the engine for C++, C and C# hosts.</text>
</svg>
